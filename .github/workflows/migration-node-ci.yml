name: Main Site Node migration CI

on:
  push:
    branches:
      - migration/node-sqlite-vps
  pull_request:
    paths:
      - 'server-node/**'
      - 'deploy/vps/**'
      - '.github/workflows/migration-node-ci.yml'
      - 'src/**'
      - 'admin/**'
      - 'assets/**'
      - '*.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite*.js'

permissions:
  contents: write

jobs:
  node-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate API lockfile on migration branch
        if: github.event_name == 'push'
        working-directory: server-node
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit API lockfile when changed
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server-node/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Node API dependencies"
            git push origin HEAD:migration/node-sqlite-vps
          fi
      - name: Install API dependencies
        working-directory: server-node
        run: npm install --no-audit --no-fund
      - name: Run API contract tests
        working-directory: server-node
        run: npm test
      - name: Check migration script syntax
        working-directory: server-node
        run: |
          node --check scripts/migrate.mjs
          node --check scripts/import-parspack.mjs
          node --check scripts/verify-import.mjs
          node --check src/server.mjs

  frontend-regression-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install existing frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build unchanged frontend
        run: npm run build
      - name: Validate dist contract
        run: npm run validate:dist
