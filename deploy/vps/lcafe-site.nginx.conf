# L Cafe Main Site only. Do not merge this server block with Operations.

server {
    listen 80;
    listen [::]:80;
    server_name l-cafe.ir www.l-cafe.ir;
    return 301 https://l-cafe.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.l-cafe.ir;

    ssl_certificate /etc/letsencrypt/live/l-cafe.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l-cafe.ir/privkey.pem;

    return 301 https://l-cafe.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name l-cafe.ir;

    ssl_certificate /etc/letsencrypt/live/l-cafe.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l-cafe.ir/privkey.pem;

    root /srv/lcafe-site/current/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    error_page 404 /404.html;

    location = /menu.html {
        return 301 https://l-cafe.ir/menu$is_args$args;
    }
    location = /menu/ {
        return 301 https://l-cafe.ir/menu$is_args$args;
    }
    location = /menu2 {
        return 301 https://l-cafe.ir/menu$is_args$args;
    }
    location = /menu2/ {
        return 301 https://l-cafe.ir/menu$is_args$args;
    }
    location = /menu2.html {
        return 301 https://l-cafe.ir/menu$is_args$args;
    }

    # Exact canonical menu route: serve the existing built file without an
    # internal redirect through /menu.html, which is itself a legacy redirect.
    location = /menu {
        alias /srv/lcafe-site/current/dist/menu.html;
        default_type text/html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Only the two stable public snapshot pointers are exposed.
    location = /managed-menu/current.json {
        alias /var/lib/lcafe-site/managed-menu/current.json;
        default_type application/json;
        etag on;
        add_header Cache-Control "public, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location = /managed-menu/previous.json {
        alias /var/lib/lcafe-site/managed-menu/previous.json;
        default_type application/json;
        etag on;
        add_header Cache-Control "public, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location ^~ /managed-menu/ {
        return 404;
    }

    # ^~ keeps the generic stable-file regex below from stealing managed
    # .webp requests and resolving them against dist instead of this alias.
    location ^~ /managed-media/ {
        if ($uri ~ "^/managed-media/[.]") { return 403; }
        if ($uri ~* "[.](php|phtml|phar|cgi|pl)$") { return 403; }
        alias /var/lib/lcafe-site/managed-media/;
        etag on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ~ /\. {
        return 404;
    }
    location ~ \.lcafe-uploading$ {
        return 404;
    }

    # Vite content-hashed assets are immutable. This precedes the stable-file rule.
    location ~* -[A-Za-z0-9_-]{8}\.(?:css|js|svg|png|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ~* \.(?:html|css|js|json|xml|txt|webp|svg|png|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
