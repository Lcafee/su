<!DOCTYPE html>
<!-- Hand-written, not generated by build.py, and deliberately free of the dc
     runtime: an error page that needs React to render is an error page that
     disappears exactly when something is already wrong. Plain HTML, the two
     self-hosted faces, and one link out. -->
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#471019">
<title>صفحه پیدا نشد — ال کافه</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/fonts/vazirmatn.css">
<link rel="stylesheet" href="assets/fonts/sahel.css">
<style>
:root{
  --font:'Vazirmatn',system-ui,sans-serif;
  --display:'Sahel','Vazirmatn',system-ui,sans-serif;
  --bg:#471019;
  --ink:#F3F1EC;
  --ink-strong:rgba(243,241,236,.82);
  --gutter:clamp(20px,6vw,80px);
  --tile:clamp(200px,46vw,346px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);font-family:var(--font);-webkit-text-size-adjust:100%}

/* Same continuous plane as the rest of the site, so a wrong address still
   lands the reader inside the same room. */
.field{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-color:var(--bg);
  background-image:url('assets/l-cafe-pattern-inverted-tight.svg');
  background-repeat:repeat;
  background-size:var(--tile) calc(var(--tile) * 0.983)}

main{position:relative;z-index:1;min-height:100svh;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,3.2vw,26px);padding:clamp(64px,12vw,120px) var(--gutter);
  text-align:center}
img.mark{width:clamp(120px,26vw,190px);height:auto;margin-bottom:clamp(10px,2vw,18px)}
h1{margin:0;font-family:var(--display);font-weight:700;
  font-size:clamp(30px,6.4vw,52px);line-height:1.3;letter-spacing:-.005em;color:var(--ink)}
p{margin:0;max-width:42ch;font:400 clamp(15px,4vw,17px)/2.1 var(--font);color:var(--ink-strong)}
a.cta{display:inline-flex;align-items:center;min-height:44px;margin-top:clamp(8px,2vw,14px);
  padding:0 30px;background:var(--ink);color:var(--bg);
  font:500 clamp(13px,3.4vw,14px)/1 var(--font);text-decoration:none;border-radius:2px}
a.cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div class="field" aria-hidden="true"></div>
<main>
<img class="mark" src="uploads/L_Cafe_Full_NoTagline_White.svg" alt="ال کافه">
<h1>این صفحه پیدا نشد</h1>
<p>شاید نشانی اشتباه تایپ شده یا صفحه‌ای که دنبالش بودید جابه‌جا شده است.</p>
<a class="cta" href="menu.html">رفتن به منو</a>
</main>
</body>
</html>
